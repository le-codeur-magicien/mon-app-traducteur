<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Coin Traduction Pédagogique 🚀</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #1e1e1e; color: #00ff00; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #252526; padding: 25px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,255,0,0.2); border: 1px solid #333; }
        h1 { text-align: center; color: #00ff00; font-size: 20px; margin-bottom: 20px; text-transform: uppercase; }
        textarea, select, button { width: 100%; padding: 12px; margin-bottom: 15px; background: #1e1e1e; border: 1px solid #00ff00; color: #00ff00; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { font-weight: bold; cursor: pointer; background: #00ff00; color: #1e1e1e; transition: all 0.2s; }
        button:hover { background: #12c012; box-shadow: 0 0 10px #00ff00; }
        .result-box { background: #1e1e1e; padding: 15px; border-left: 4px solid #00ff00; margin-top: 15px; display: none; line-height: 1.6; white-space: pre-line; }
        .loader { display: none; text-align: center; font-style: italic; color: #888; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>[ IA Connectée ] Traducteur Pédagogique v2</h1>
    
    <textarea id="textInput" placeholder="Tape N'IMPORTE QUELLE phrase (ex: Je mange une banane)"></textarea>

    <select id="langSelect">
        <option value="Allemand">Allemand 🇩🇪</option>
        <option value="Anglais">Anglais 🇬🇧</option>
        <option value="Espagnol">Espagnol 🇪🇸</option>
    </select>

    <button onclick="appelerIA()">LANCER L'ANALYSE PAR L'IA</button>

    <div id="loader" class="loader">🤖 L'IA analyse les structures grammaticales... patiente...</div>
    <div id="result" class="result-box"></div>
</div>

<script>
    async function appelerIA() {
        const texte = document.getElementById('textInput').value.trim();
        const lang = document.getElementById('langSelect').value;
        const resultBox = document.getElementById('result');
        const loader = document.getElementById('loader');

        if (!texte) { alert("Entre une phrase à analyser !"); return; }

        loader.style.display = "block";
        resultBox.style.display = "none";

        const prompt = `Agis comme un prof de langue. Traduis en ${lang} la phrase : "${texte}". 
        Donne la réponse en français sous cette forme précise :
        1. LA TRADUCTION FINALE (en gras)
        2. EXPLICATION DU VOCABULAIRE ET DE LA GRAMMAIRE (Explique pourquoi on conjugue comme ça, s'il y a un piège, une terminaison spéciale ou un ordre des mots inversé). Rends cela super simple et fun.`;

        try {
            // Utilisation d'un proxy open-source pour interroger l'IA de DuckDuckGo sans clé API
            const response = await fetch('https://aryahcr.cc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [{ role: "user", content: prompt }],
                    model: "Llama-3.1-70B-Instruct", // Un modèle d'IA surpuissant et libre d'accès
                    stream: false
                })
            });

            const data = await response.json();
            let aiReply = data.gpt || data.message || "Désolé, l'IA a eu un bug sur cette phrase.";
            
            // Formatage rapide du gras markdown en HTML
            aiReply = aiReply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            loader.style.display = "none";
            resultBox.innerHTML = aiReply;
            resultBox.style.display = "block";

        } catch (error) {
            loader.style.display = "none";
            alert("Erreur de connexion avec le serveur de l'IA. Réessaie !");
            console.error(error);
        }
    }
</script>

</body>
</html>
