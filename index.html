<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Coin Traduction Pédagogique 🚀</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #1e1e1e; color: #00ff00; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #252526; padding: 25px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,255,0,0.2); border: 1px solid #333; }
        h1 { text-align: center; color: #00ff00; font-size: 16px; margin-bottom: 20px; text-transform: uppercase; }
        textarea, select, button { width: 100%; padding: 12px; margin-bottom: 15px; background: #1e1e1e; border: 1px solid #00ff00; color: #00ff00; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { font-weight: bold; cursor: pointer; background: #00ff00; color: #1e1e1e; transition: all 0.2s; }
        button:hover { background: #12c012; box-shadow: 0 0 10px #00ff00; }
        .result-box { background: #1e1e1e; padding: 15px; border-left: 4px solid #00ff00; margin-top: 15px; display: none; line-height: 1.6; white-space: pre-line; color: #fff; }
        .loader { display: none; text-align: center; font-style: italic; color: #888; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>[ UNLOCKED IA ] Traducteur Virtuel v15</h1>
    
    <textarea id="textInput" placeholder="Tape absolument N'IMPORTE QUELLE phrase..."></textarea>

    <select id="langSelect">
        <option value="allemand">Allemand 🇩🇪</option>
        <option value="anglais">Anglais 🇬🇧</option>
        <option value="espagnol">Espagnol 🇪🇸</option>
    </select>

    <button onclick="appelerLeServeurIA()">LANCER LE PROMPT IA</button>

    <div id="loader" class="loader">🤖 Le serveur IA sécurisé analyse ta phrase... Patiente...</div>
    <div id="result" class="result-box"></div>
</div>

<script>
    async function appelerLeServeurIA() {
        const texte = document.getElementById('textInput').value.trim();
        const lang = document.getElementById('langSelect').value;
        const resultBox = document.getElementById('result');
        const loader = document.getElementById('loader');

        if (!texte) { alert("Tape un texte, l'ami !"); return; }

        loader.style.display = "block";
        resultBox.style.display = "none";

        const promptConsigne = `Agis comme un prof de langue. Traduis en ${lang} la phrase : "${texte}". Donne la réponse en français structurée exactement comme ça : 1. LA TRADUCTION FINALE (en gras). 2. DÉCORTICAGE DES MOTS. 3. EXPLICATION DE LA GRAMMAIRE ET DES PIÈGES (conjugaison, majuscules, ordre des mots).`;

        try {
            // Requête sur un miroir d'API textuel ultra-stable ouvert et gratuit
            const response = await fetch(`https://pollinations.ai{encodeURIComponent(promptConsigne)}?model=searchgpt`);
            const aiReply = await response.text();
            
            if (aiReply) {
                // Transforme le gras markdown de l'IA en balises HTML visibles sur la page
                let formatReply = aiReply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                
                loader.style.display = "none";
                resultBox.innerHTML = formatReply;
                resultBox.style.display = "block";
            } else {
                throw new Error("Pas de texte retourné");
            }

        } catch (error) {
            loader.style.display = "none";
            alert("Erreur de connexion avec la passerelle IA de secours.");
            console.error(error);
        }
    }
</script>

</body>
</html>
